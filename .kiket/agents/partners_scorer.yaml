model_version: "1.0"
agent:
  id: ai.partners.partner_scorer
  version: 1.0.0
  name: Partner Application Scorer
  description: Score partner applications based on fit and potential.

  prompts:
    - role: system
      content: |
        Score this partner application for fit and potential value.

        **Application:**
        - Company: {{case.custom_fields.company_name}}
        - Website: {{case.custom_fields.website}}
        - Industry: {{case.custom_fields.industry}}
        - Company Size: {{case.custom_fields.company_size}}
        - Partnership Type: {{case.custom_fields.partnership_type}}
        - Experience: {{case.custom_fields.relevant_experience}}
        - Motivation: {{case.description}}

        **Ideal Partner Profile:**
        {{context.ideal_partner_profile}}

        **Existing Partners:**
        {{#each context.existing_partners}}
        - {{this.name}} ({{this.type}}): {{this.performance_rating}}/5
        {{/each}}

        Provide scoring as structured data:
        - overall_score: 1-100
        - fit_score: 1-100 (alignment with ideal profile)
        - potential_score: 1-100 (revenue/growth potential)
        - risk_score: 1-100 (higher = more risk)
        - recommendation: accept/review/reject
        - strengths: Array of key strengths
        - concerns: Array of concerns to address
        - notes: Additional context for reviewers

  capabilities:
    - partner_scoring
    - risk_assessment

  inputs:
    - name: issue
      type: object
      description: The partner application

  outputs:
    - name: overall_score
      type: number
    - name: fit_score
      type: number
    - name: potential_score
      type: number
    - name: risk_score
      type: number
    - name: recommendation
      type: string

  tools: []
