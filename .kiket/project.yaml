model_version: "1.0"
project:
  key: PARTNERS
  name: Partner Management
  version: 1.0.0
  description: Partner application, onboarding, and certification workflows.

  team:
    roles:
      - name: partner_manager
        description: Partner manager overseeing relationships and onboarding
      - name: enablement
        description: Partner enablement specialist providing training and resources
      - name: success_manager
        description: Partner success manager ensuring satisfaction and growth

  extensions:
    required:
      - email
    optional:
      - slack

  seed_data:
    issues:
      - title: CloudScale Solutions partner application
        description: Mid-market MSP with 200+ customers in EMEA. Strong technical team, requesting integration partnership tier.
        issue_type: partner_application
        status: evaluating
        priority: high
        labels:
          - msp
          - emea

      - title: DataBridge Analytics onboarding
        description: Accepted partner completing platform training and certification. Specializes in analytics consulting for retail clients.
        issue_type: partner_onboarding
        status: onboarding
        priority: medium
        labels:
          - consulting
          - analytics

      - title: NexGen IT Services certification renewal
        description: Existing partner due for annual certification renewal. Current score 92/100, needs to complete updated quiz and demo project.
        issue_type: certification
        status: onboarding
        priority: medium
        labels:
          - renewal
          - certification

      - title: Streamline Co partner application
        description: Small agency specializing in project management tooling for creative teams. Applying for referral partner tier.
        issue_type: partner_application
        status: applied
        priority: low
        labels:
          - agency
          - referral

      - title: TechForward Inc activation
        description: Recently certified systems integrator ready to be listed in the partner directory and receive co-marketing materials.
        issue_type: partner_onboarding
        status: certified
        priority: high
        labels:
          - systems-integrator
          - activation

      - title: Apex Digital partner application review
        description: Enterprise consultancy with Fortune 500 clients applying for premium partner tier. Requires executive review due to deal size.
        issue_type: partner_application
        status: evaluating
        priority: critical
        labels:
          - enterprise
          - premium-tier
